    contract:
      method: "GET"
      path: "/api/v1/customer/custom-orders/{requestId}"
      request: "Path requestId; HttpSession USER role and customerId."
      response: "JSON order detail; unpublished quote fields/notes are hidden; customer status reflects published quote/payment submission."
      error: "401 without customer session; 404 when the request does not belong to the customer or does not exist."
      auth: "Authenticated customer; SQL query constrains both requester_customer_id and order_id."
    target_contract:
      method: "GET /api/v1/customer/custom-orders/{requestId}"
      notes: "Preserve the ownership-constrained lookup and quote visibility behavior."
    semantic_divergence: []

  - name: custom-order-request-submission
    unit: customer-custom-orders
    type: rest
