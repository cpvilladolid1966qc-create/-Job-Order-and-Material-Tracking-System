    contract:
      method: "POST"
      path: "/api/v1/custom-orders"
      request: "multipart/form-data length,width,unit,frame; optional customFrameRequest,message,referenceImage"
      response: "201 JSON {orderId,status,quote}; persisted custom_orders row and optional reference image."
      error: "400 validation error; 401 when not signed in; multipart-image limits are governed by application properties plus controller validation."
      auth: "USER role with customer identity in HttpSession; requester snapshot is read from the session/database."
    target_contract:
