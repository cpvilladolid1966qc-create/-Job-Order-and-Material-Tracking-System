      request: "POST order/customer/item/amount data; PATCH status/payment transition data. Actor and event time are server-derived."
      response: "GET returns DB-backed orders; POST returns created order; PATCH returns authoritative updated status."
      error: "400 invalid order/payment; 404 unknown order; 409 invalid/repeated transition."
      auth: "ADMIN/STAFF; server enforces each permitted operational transition."
    target_contract:
      method: "GET/POST /api/v1/orders; PATCH /api/v1/orders/{orderId}/status"
      notes: "Proposed replacement for styleMariaPosOrders and dashboard business order localStorage; start empty and do not import browser values. STAFF operational status values are PENDING, FOR_CONFIRMATION, IN_PRODUCTION, and COMPLETED. Persist each mutation and audit together."
