    contract:
      method: "GET"
      path: "/api/v1/customer/custom-orders"
      request: "No body; HttpSession must contain USER role and customerId."
      response: "JSON array of order summaries filtered by custom_orders.requester_customer_id; sorted newest first."
      error: "401 JSON message when no signed-in customer session."
      auth: "Customer session; server-side requester_customer_id filter."
    target_contract:
      method: "GET /api/v1/customer/custom-orders"
      notes: "Preserve route, summary semantics, session ownership filter, ordering, and customer-only access."
    semantic_divergence: []

  - name: customer-custom-order-detail
    unit: customer-custom-orders
