  - name: wastage-log-create
    unit: wastage-workflow
    type: rest
    stability: may_change
    source_loc: "src/main/java/com/job_order_and_material_tracking_system/stylemaria/StylemariaApplication.java:1355"
    contract:
      method: "POST"
      path: "/api/v1/wastage (alias /api/wastage)"
      request: "JSON WastageRequest with order/material/quantity/reason/action/unit/context, caller-supplied loggedBy, recoverable, and status."
      response: "201 WastageLog with server-generated ID/time and calculated material/labour/total impact."
      error: "400 for invalid/missing values; unauthorized access currently handled by interceptor."
      auth: "ADMIN session required by exact-path interceptor mapping; current loggedBy value is accepted from request."
    target_contract:
      method: "POST /api/v1/wastage"
      notes: "Derive actor from ADMIN/STAFF session; in one transaction persist wastage log, WASTAGE inventory movement, and audit event."
    semantic_divergence: []

  - name: target-inventory-catalog
    unit: inventory-management
    type: rest
    stability: may_change
    source_loc: "src/main/resources/static/inventory.html:114"
    contract:
      method: "GET, POST, PATCH"
      path: "/api/v1/inventory/materials[/{materialId}]"
      request: "Proposed catalog JSON: name, category, unit, lowStockThreshold, active; PATCH updates metadata/status only."
      response: "GET returns DB-backed materials with quantity/low-stock status; POST creates a material at zero stock; PATCH returns updated material."
      error: "400 invalid fields; 404 unknown material; 409 duplicate/constraint conflict."
      auth: "ADMIN for catalog create/update/deactivate; STAFF/ADMIN may read catalog."
    target_contract:
      method: "GET/POST /api/v1/inventory/materials; PATCH /api/v1/inventory/materials/{materialId}"
      notes: "Proposed interface anchored to the current inventory page. Use typed JSON DTOs; status changes are soft deactivation and must not rewrite movement history."
    semantic_divergence: []

  - name: target-inventory-movements
    unit: inventory-management
    type: rest
    stability: may_change
    source_loc: "src/main/resources/static/inventory.html:127"
    contract:
      method: "GET, POST"
      path: "/api/v1/inventory/movements"
      request: "POST JSON {materialId,type,quantity,reason,adjustmentDirection?,orderId?,description?}; type in RECEIPT, USAGE, RETURN, ADJUSTMENT. adjustmentDirection is required only for ADJUSTMENT; WASTAGE is created only through POST /api/v1/wastage. Actor and timestamp are server-derived."
      response: "POST returns the appended movement and current material balance; GET returns append-only history, optionally filtered by materialId/type/orderId/date."
      error: "400 invalid quantity/type/reason; 404 missing material; 409 insufficient stock or concurrent state conflict."
      auth: "ADMIN/STAFF; actor is taken from authenticated session, never request JSON."
    target_contract:
      method: "GET/POST /api/v1/inventory/movements"
      notes: "Proposed API for the current page-only stock-in and reversal actions. Balance, ledger entry, and audit entry must be atomic; no update/delete ledger endpoint. The wastage endpoint is the only public path that creates WASTAGE ledger entries."
    semantic_divergence: []

  - name: target-staff-administration
    unit: identity-and-staff
    type: rest
    stability: may_change
    source_loc: "src/main/resources/static/reports.html:123"
    contract:
      method: "GET, POST, PATCH"
      path: "/api/v1/admin/staff[/{staffId}]; /api/v1/admin/staff/invitations"
      request: "GET no body; POST invitation {name,email,jobTitle?}; PATCH {active}; authorization role is fixed to STAFF for invitees and is not caller-selectable."
      response: "GET returns persisted staff directory; POST returns 202 invitation status without raw token; PATCH returns updated staff status."
      error: "400 invalid name/email; 403 non-admin; 409 duplicate account/open invite; 503 mail delivery failure."
      auth: "ADMIN only."
    target_contract:
      method: "GET /api/v1/admin/staff; POST /api/v1/admin/staff/invitations; PATCH /api/v1/admin/staff/{staffId}"
      notes: "Proposed staff-management API. The current free-text UI role is a display title only, not a permission role. Send raw token only in invite email; persist token hash/expiry/used state; audit the issuance/status mutation."
    semantic_divergence: []

  - name: target-staff-invitation-acceptance
    unit: identity-and-staff
    type: rest
    stability: may_change
    source_loc: "src/main/resources/static/reports.html:123"
    contract:
      method: "POST"
      path: "/api/v1/staff/invitations/accept"
      request: "JSON {token,newPassword}; token is a random one-time invite secret received by email."
      response: "201 account-activated result; do not return the token or password."
      error: "400 invalid password/token shape; 410 expired/used token; 409 account already activated."
      auth: "Invite token is the sole unauthenticated proof; hash lookup, expiry, email identity, and one-time consumption are enforced server-side."
    target_contract:
      method: "POST /api/v1/staff/invitations/accept"
      notes: "Consume invitation and create/activate staff credential atomically; invalidate token on success."
    semantic_divergence: []

  - name: target-pos-orders
