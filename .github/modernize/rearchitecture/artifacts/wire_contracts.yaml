contracts:
  - name: session-login
    unit: identity-and-staff
    type: rest
    stability: must_preserve
    source_loc: "src/main/java/com/job_order_and_material_tracking_system/stylemaria/StylemariaApplication.java:131"
    contract:
      method: "POST"
      path: "/login"
      request: "application/x-www-form-urlencoded username,password"
      response: "302 redirect to /admin.html for ADMIN or /home.html for USER; invalid credentials redirect to /?error=invalid"
      error: "Invalid account/password does not expose a distinct backend credential error."
      auth: "Creates HttpSession role; ADMIN credential values are externalized through ADMIN_EMAIL/ADMIN_PASSWORD; customers authenticate from customer_accounts."
    target_contract:
      method: "POST /login"
      notes: "Keep configured admin login and existing customer login; extend identity lookup for persisted STAFF accounts, invalidate prior session on successful login, and never accept role/actor from the form."
    semantic_divergence: []

  - name: customer-owned-custom-order-list
    unit: customer-custom-orders
