  - name: admin-custom-order-review
    unit: admin-order-workflow
    type: rest
    stability: must_preserve
    source_loc: "src/main/java/com/job_order_and_material_tracking_system/stylemaria/StylemariaApplication.java:1007"
    contract:
      method: "GET"
      path: "/api/v1/admin/custom-orders[/{requestId}[/{reference-image|payment-proof}]]"
      request: "Optional requestId; no body."
      response: "JSON list/detail or image/receipt bytes; detail joins custom_orders and custom_order_checkouts."
      error: "404 for missing detail/asset; unauthorized access currently handled by DemoRoleInterceptor."
      auth: "ADMIN session required by interceptor on /api/v1/admin/custom-orders and descendants."
    target_contract:
      method: "GET /api/v1/admin/custom-orders"
      notes: "Preserve review/detail/proof paths and existing DB-backed customer orders; API authorization must return explicit JSON 401/403 rather than rely on browser navigation."
    semantic_divergence: []

  - name: admin-custom-order-status-update
    unit: admin-order-workflow
    type: rest
    stability: may_change
    source_loc: "src/main/java/com/job_order_and_material_tracking_system/stylemaria/StylemariaApplication.java:1122"
    contract:
      method: "PUT"
      path: "/api/v1/admin/custom-orders/{requestId}"
      request: "JSON {status,notes}; existing allowed status values: NEW_REQUEST, FOR_QUOTATION, NEEDS_INFO."
      response: "200 JSON {requestId,status} for an existing row."
      error: "400 invalid status/notes; 404 unknown order; unauthorized access currently handled by interceptor."
      auth: "ADMIN session required."
    target_contract:
      method: "PUT /api/v1/admin/custom-orders/{requestId}"
      notes: "Keep admin quote/control permissions; add separately constrained STAFF operational transitions and same-transaction audit events; do not broaden STAFF to quote/payment-verification actions."
    semantic_divergence: []

  - name: admin-quote-draft-and-publish
    unit: admin-order-workflow
    type: rest
    stability: must_preserve
    source_loc: "src/main/java/com/job_order_and_material_tracking_system/stylemaria/StylemariaApplication.java:1151"
    contract:
      method: "PUT draft; POST publish"
      path: "/api/v1/admin/custom-orders/{requestId}/quote-draft; /api/v1/admin/custom-orders/{requestId}/publish-quote"
      request: "JSON amounts baseMirrorAmount, frameAmount, laborAmount, deliveryAmount and notes."
      response: "JSON requestId/status/total; publication sets quote_sent_at and FOR_QUOTATION."
      error: "400 for missing/negative/overprecision/oversized quote; 404 if order absent; unauthorized access currently handled by interceptor."
      auth: "ADMIN session required."
    target_contract:
      method: "PUT /api/v1/admin/custom-orders/{requestId}/quote-draft; POST /api/v1/admin/custom-orders/{requestId}/publish-quote"
      notes: "Preserve existing paths and quote calculations; only ADMIN can create/publish official quotes; write audit with the same transaction."
    semantic_divergence: []

  - name: wastage-log-read
