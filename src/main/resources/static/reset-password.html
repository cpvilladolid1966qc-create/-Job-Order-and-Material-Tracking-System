<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Style Maria</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/store.js" defer></script>
</head>
<body class="login-page">
<header class="topbar">
    <a class="logo" href="/" aria-label="Style Maria home">SM</a>
    <div class="brand-name">STYLE MARIA</div>
</header>
<main class="login-layout">
    <section class="intro">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Choose a new password.</h1>
        <p class="intro-subtitle">Use a password you haven’t used for this account before.</p>
    </section>
    <section class="login-card">
        <h2>Reset password</h2>
        <p class="card-subtitle">Your reset link is valid for 30 minutes and can only be used once.</p>
        <form id="reset-password-form" action="/reset-password" method="post">
            <input id="reset-token" name="token" type="hidden">
            <label for="new-password">New password</label>
            <div class="password-field">
                <input id="new-password" name="password" type="password" autocomplete="new-password"
                       minlength="12" maxlength="128" placeholder="Create a password (12+ characters)" required>
                <button class="password-visibility-toggle" type="button" aria-label="Show password"
                        aria-pressed="false" data-toggle-password="new-password">
                    <svg class="password-eye-icon" aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-eye-slash" d="M4 4l16 16"></path>
                    </svg>
                </button>
            </div>
            <label for="confirm-new-password">Confirm new password</label>
            <div class="password-field">
                <input id="confirm-new-password" name="confirmPassword" type="password"
                       autocomplete="new-password" minlength="12" maxlength="128"
                       placeholder="Enter the password again" required>
                <button class="password-visibility-toggle" type="button" aria-label="Show password"
                        aria-pressed="false" data-toggle-password="confirm-new-password">
                    <svg class="password-eye-icon" aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-eye-slash" d="M4 4l16 16"></path>
                    </svg>
                </button>
            </div>
            <p class="error-message" id="reset-password-error" role="alert" hidden></p>
            <button class="sign-in-button" type="submit">Save new password</button>
            <a class="forgot-password-link" href="/forgot-password.html">Request another reset link</a>
            <a class="forgot-password-link" href="/">Back to sign in</a>
        </form>
    </section>
</main>
</body>
</html>
