spring.application.name=stylemaria
app.admin.email=${ADMIN_EMAIL:admin@stylemaria.com}
app.admin.password=${ADMIN_PASSWORD:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stylemaria?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:no-reply@stylemaria.com}
