<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Order — Style Maria Workshop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sm-page">
    <div style="max-width: 760px; margin: 0 auto;">
      <h1 class="sm-title" style="text-align:center;">Track Your Order</h1>
      <p class="sm-sub" style="text-align:center;">Enter your order reference number to see progress.</p>

      <div class="sm-card">
        <div id="alert-slot"></div>
        <form id="track-form" style="display:flex; gap:10px;">
          <input type="text" id="ref" placeholder="Enter Order Reference Number (e.g. SM-...)" required data-testid="track-ref-input" style="flex:1;">
          <button class="btn btn-primary" type="submit" data-testid="track-submit">Track</button>
        </form>

        <div id="result" style="display:none; margin-top:24px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 10px;">
            <div>
              <div class="small">Reference</div>
              <div id="r-ref" style="font-weight:600;" data-testid="r-ref"></div>
            </div>
            <div>
              <span id="r-status" class="badge" data-testid="r-status"></span>
            </div>
          </div>
          <div class="tracker" id="tracker"></div>
          <div class="small" style="margin-top:14px;" id="r-total" data-testid="r-total"></div>
        </div>

        <div style="margin-top: 28px;">
          <h3 class="serif" style="margin:0 0 10px;">Your recent orders</h3>
          <div id="mine" data-testid="mine-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const user = requireAuth();
    if (user) renderHeader('track');
    const alertSlot = document.getElementById('alert-slot');

    const STAGES = ['PENDING', 'IN_PRODUCTION', 'SCHEDULED', 'COMPLETED'];
    const LABELS = { PENDING: 'Pending', IN_PRODUCTION: 'In Production', SCHEDULED: 'Scheduled for Delivery', COMPLETED: 'Completed' };

    function renderTracker(status) {
      const tracker = document.getElementById('tracker');
      tracker.innerHTML = '';
      const activeIdx = STAGES.indexOf(status === 'PENDING_PAYMENT' ? 'PENDING' : status);
      STAGES.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'step' + (i <= activeIdx ? ' done' : '');
        el.innerHTML = `<div class="line"></div><div class="dot">${i+1}</div><div class="label">${LABELS[s]}</div>`;
        tracker.appendChild(el);
      });
    }

    document.getElementById('track-form').onsubmit = async (e) => {
      e.preventDefault();
      alertSlot.innerHTML = '';
      const ref = document.getElementById('ref').value.trim();
      try {
        const o = await api('/orders/track/' + encodeURIComponent(ref));
        showResult(o);
      } catch (err) {
        document.getElementById('result').style.display = 'none';
        showAlert(alertSlot, err.message);
      }
    };

    function showResult(o) {
      document.getElementById('result').style.display = 'block';
      document.getElementById('r-ref').textContent = o.reference;
      const b = document.getElementById('r-status');
      b.textContent = (o.status || '').replace(/_/g, ' ');
      b.className = 'badge badge-' + o.status;
      document.getElementById('r-total').textContent = 'Total: ' + peso(o.total);
      renderTracker(o.status);
    }

    (async () => {
      try {
        const orders = await api('/orders/mine');
        const list = document.getElementById('mine');
        if (!orders.length) { list.innerHTML = '<p class="small">No orders yet.</p>'; return; }
        list.innerHTML = orders.map(o => `
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);">
            <div>
              <div style="font-weight:600;">${o.reference}</div>
              <div class="small">${new Date(o.createdAt).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <span class="badge badge-${o.status}">${o.status.replace(/_/g,' ')}</span>
              <div class="small" style="margin-top:4px;">${peso(o.total)}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    })();
  </script>
</body>
</html>
