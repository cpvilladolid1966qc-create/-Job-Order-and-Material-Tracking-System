<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order — Style Maria Workshop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sm-page">
    <div style="max-width: 640px; margin: 0 auto;">
      <h1 class="sm-title" style="text-align:center;">Order with clarity.</h1>
      <p class="sm-sub" style="text-align:center;">Specify your custom frame or mirror dimensions.</p>

      <div class="sm-card">
        <div id="alert-slot"></div>
        <form id="order-form">
          <div class="input-row">
            <div>
              <label>Length</label>
              <div class="unit-input">
                <input type="number" id="length" min="1" step="0.1" value="24" required data-testid="length-input">
                <span class="unit">cm</span>
              </div>
            </div>
            <div>
              <label>Width</label>
              <div class="unit-input">
                <input type="number" id="width" min="1" step="0.1" value="36" required data-testid="width-input">
                <span class="unit">cm</span>
              </div>
            </div>
          </div>
          <div class="spacer"></div>

          <label>Select Frame Material</label>
          <select id="material" data-testid="material-select">
            <option>Solid Wood</option>
            <option>MDF</option>
            <option>Aluminum</option>
          </select>

          <div class="spacer"></div>

          <label>Upload Reference Image (optional)</label>
          <div class="upload-box" id="upload-box" data-testid="upload-box">
            <div class="ic">⬆</div>
            <div class="ttl" id="upload-title">Upload Reference Image</div>
            <div class="sub" id="upload-sub">Click or drop a file (PNG, JPG)</div>
            <input type="file" id="ref-file" accept="image/*" style="display:none" data-testid="ref-file-input">
          </div>

          <div class="spacer"></div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin: 20px 0;">
            <div>
              <div class="small">Estimated unit price</div>
              <div style="font-size:22px; font-weight:600; color:var(--olive-dark);" id="quote" data-testid="quote">₱0.00</div>
            </div>
            <button type="button" class="btn btn-ghost" id="quote-btn" data-testid="quote-btn">Get Quote</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-testid="add-to-cart-btn">Add to Cart & Continue</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const user = requireAuth();
    if (user) renderHeader('order');

    const alertSlot = document.getElementById('alert-slot');
    const uploadBox = document.getElementById('upload-box');
    const refFile = document.getElementById('ref-file');
    let referenceImageUrl = null;

    uploadBox.onclick = () => refFile.click();
    refFile.onchange = async () => {
      if (!refFile.files.length) return;
      try {
        const r = await apiUpload(refFile.files[0]);
        referenceImageUrl = r.url;
        uploadBox.classList.add('has-file');
        document.getElementById('upload-title').textContent = refFile.files[0].name;
        document.getElementById('upload-sub').textContent = 'Uploaded. Click to change.';
      } catch (e) { showAlert(alertSlot, e.message); }
    };

    async function refreshQuote() {
      const l = parseFloat(document.getElementById('length').value);
      const w = parseFloat(document.getElementById('width').value);
      const m = document.getElementById('material').value;
      if (!l || !w) return;
      try {
        const q = await api(`/quote?length=${l}&width=${w}&material=${encodeURIComponent(m)}`);
        document.getElementById('quote').textContent = peso(q.unitPrice);
      } catch (e) { /* ignore */ }
    }
    document.getElementById('quote-btn').onclick = refreshQuote;
    ['length','width','material'].forEach(id => document.getElementById(id).addEventListener('change', refreshQuote));
    refreshQuote();

    document.getElementById('order-form').onsubmit = async (e) => {
      e.preventDefault();
      alertSlot.innerHTML = '';
      try {
        await api('/cart', {
          method: 'POST',
          body: {
            length: parseFloat(document.getElementById('length').value),
            width: parseFloat(document.getElementById('width').value),
            frameMaterial: document.getElementById('material').value,
            referenceImage: referenceImageUrl,
            quantity: 1
          }
        });
        window.location.href = 'cart.html';
      } catch (err) { showAlert(alertSlot, err.message); }
    };
  </script>
</body>
</html>
